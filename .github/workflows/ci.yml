name: Laravel CI/CD

# Les vérifications se lancent à chaque push et pull request.
# Le déploiement ne peut être demandé que lors d'un lancement manuel.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production after the checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Vérifie les fichiers essentiels et la cohérence de composer.json.
  code_check:
    name: Code check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, pdo_sqlite, zip
          coverage: none
          cache: composer

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

  # Installe les dépendances une fois, puis les partage avec les jobs suivants.
  build_app:
    name: Build dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, pdo_sqlite, zip
          coverage: none
          cache: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: |
            vendor/
            composer.lock
          if-no-files-found: error
          retention-days: 1

  # Échoue si Composer détecte une vulnérabilité connue dans les dépendances.
  dependency_audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest
    needs: build_app
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, pdo_sqlite, zip
          coverage: none
          cache: composer

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: vendor

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

  # Prépare une base SQLite temporaire et exécute la suite de tests Laravel.
  test_app:
    name: Laravel tests
    runs-on: ubuntu-latest
    needs: build_app
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, pdo_sqlite, zip
          coverage: none
          cache: composer

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: vendor

      - name: Prepare SQLite testing environment
        run: |
          cp .env.testing .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan config:clear
          php artisan migrate:fresh --env=testing --force

      - name: Run Laravel tests
        run: php artisan test

  # Sur main seulement, crée une archive contenant les dépendances de production.
  release_app:
    name: Build production release
    runs-on: ubuntu-latest
    needs:
      - code_check
      - dependency_audit
      - test_app
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, xml, pdo_sqlite, zip
          coverage: none
          cache: composer

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Create release archive
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.testing \
            --exclude=database/database.sqlite \
            --exclude=release.tar.gz \
            .

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Le choix manuel d'un déploiement est demandé via workflow_dispatch.
  # Configure les secrets SSH et les variables DEPLOY_* dans les paramètres GitHub.
  deploy_prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: release_app
    if: github.ref == 'refs/heads/main' && inputs.deploy_production
    environment:
      name: production
    steps:
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          # Refuse de continuer si les clés SSH ne sont pas configurées.
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing secret SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing secret SSH_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer and activate release
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -eu
          # Vérifie les paramètres de destination avant toute connexion SSH.
          test -n "$DEPLOY_USER" || { echo "Missing repository variable DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "Missing repository variable DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing repository variable DEPLOY_PATH"; exit 1; }

          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          REMOTE_RELEASE="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ARCHIVE="release-$GITHUB_SHA.tar.gz"

          # Transfère et extrait la release dans un dossier versionné par commit.
          scp release.tar.gz "$REMOTE:/tmp/$ARCHIVE"
          ssh "$REMOTE" "mkdir -p '$REMOTE_RELEASE' '$DEPLOY_PATH/shared/storage'"
          ssh "$REMOTE" \
            "tar -xzf '/tmp/$ARCHIVE' -C '$REMOTE_RELEASE' && rm -f '/tmp/$ARCHIVE'"
          ssh "$REMOTE" "test -f '$DEPLOY_PATH/shared/.env'"
          ssh "$REMOTE" \
            "cd '$REMOTE_RELEASE' &&
             ln -sfn '$DEPLOY_PATH/shared/.env' .env &&
             rm -rf storage &&
             ln -sfn '$DEPLOY_PATH/shared/storage' storage &&
             mkdir -p bootstrap/cache &&
             php artisan migrate --force &&
             php artisan config:cache &&
             ln -sfn '$REMOTE_RELEASE' '$DEPLOY_PATH/current'"

  # Affiche un exemple de rollback uniquement si le déploiement de production échoue.
  rollback_notice:
    name: Rollback message (example only)
    runs-on: ubuntu-latest
    needs: deploy_prod
    if: failure() && needs.deploy_prod.result == 'failure'
    steps:
      - name: Display example rollback message
        run: |
          echo "Exemple : le déploiement en production a échoué ; un rollback devrait être effectué."
